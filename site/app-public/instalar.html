<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08783f"><link rel="manifest" href="/app/manifest.webmanifest?v=5"><title>Instalar MyBot</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#08783f,#032f1e);font-family:Arial;color:#fff}main{max-width:420px;margin:20px;padding:32px;text-align:center;border-radius:28px;background:#063c25;border:1px solid #7de6a9}.logo{width:150px;max-width:80%}.lista{text-align:left;line-height:1.7;background:#0c5939;padding:18px;border-radius:16px}.botao{width:100%;padding:18px;border:0;border-radius:14px;background:#25cf72;color:#042716;font-weight:bold;font-size:16px;cursor:pointer}.ajuda{font-size:13px;line-height:1.5;color:#d5eddf}</style></head><body><main><img class="logo" src="/painel/mybot-logo-verde.png" alt="MyBot"><h1>Instale o MyBot</h1><p>Adicione o MyBot à tela inicial para abrir como aplicativo.</p><div class="lista">✓ Ícone MyBot no celular ou computador<br>✓ Acesso seguro aos portais<br>✓ Administrador e Atendente separados</div><p><button class="botao" id="instalar" type="button">⬇ INSTALAR MYBOT</button></p><p class="ajuda" id="ajuda">Preparando a instalação...</p></main><script>const b=document.querySelector('#instalar'),a=document.querySelector('#ajuda');let p;async function pronto(){try{await navigator.serviceWorker.register('/app/service-worker.js');if(!navigator.serviceWorker.controller&&!sessionStorage.getItem('mybot-pwa-v4')){sessionStorage.setItem('mybot-pwa-v4','1');location.reload();return}}catch(_){}a.textContent='Use o ícone de instalar na barra do Chrome ou aguarde alguns segundos.'}addEventListener('beforeinstallprompt',e=>{e.preventDefault();p=e;a.textContent='Pronto: toque em INSTALAR MYBOT para confirmar.'});addEventListener('appinstalled',()=>{b.disabled=true;b.textContent='✓ MYBOT INSTALADO';a.textContent='Pronto! Abra o ícone MyBot para acessar a Central.'});b.onclick=async()=>{if(!p){a.textContent='Use o ícone de instalar na barra de endereço do Chrome.';return}p.prompt();await p.userChoice;p=null};pronto()</script></body></html>
